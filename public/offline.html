<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <title>System — offline</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0a0a0c;
        color: #ede6d8;
        font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 320px; text-align: center; animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
      svg { width: 44px; height: 44px; opacity: 0.7; }
      h1 { margin: 20px 0 8px; font-size: 13px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #b9b2a3; }
      p { margin: 0 0 22px; font-size: 12px; line-height: 1.7; color: #7d7769; }
      button {
        font: inherit; font-size: 12px; color: #b9b2a3; background: transparent;
        border: 1px solid #332c22; border-radius: 999px; padding: 8px 18px; cursor: pointer;
        transition: transform 0.15s ease, border-color 0.2s ease, color 0.2s ease;
      }
      button:hover { border-color: #5a4f3f; color: #ede6d8; }
      button:active { transform: scale(0.95); }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { main { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System">
        <rect x="0.5" y="0.5" width="39" height="39" rx="11" fill="#1B1813" stroke="#332C22" />
        <circle cx="20" cy="20" r="14.5" fill="#EDE6D8" />
        <circle cx="20" cy="20" r="11" fill="#1B1813" />
        <circle cx="20" cy="20" r="7.6" fill="#7C9468" />
        <circle cx="20" cy="20" r="4.3" fill="#1B1813" />
        <circle cx="20" cy="20" r="2.3" fill="#C17A4E" />
      </svg>
      <h1>You&rsquo;re offline</h1>
      <p>
        System shows your week live, so it needs a connection. Nothing is lost &mdash; it will pick up as soon as
        you&rsquo;re back online.
      </p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () { location.reload(); });
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
